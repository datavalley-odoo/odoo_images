services:
  odoo:
    build:
      context: ./odoo
      dockerfile: dockerfile
    restart: always
    depends_on:
      - "database"
    networks:
      - "odoo"
    volumes:
      - "./1st-party:/mnt/1st-party"
      - "./2nd-party:/mnt/2nd-party"
      - "./3rd-party:/mnt/extra-addons"
      - "./odoo:/etc/odoo"
      - "filestore:/var/lib/odoo"
    environment:
      - "PORT=1002"
      - "HOST=database"
      - "USER=Vc617eNaA0v1j6B"
      - "PASSWORD=RPu4Jito7ZjZWrEnDeB4dS0UxVuEIJhvMGXiXbw0Sr6uTd2Li2h7wE1YI60L6RtrsoY8h2bfjAPZ7z1nkbpeV"

  database:
    image: postgres:17.4-alpine3.21
    restart: always
    networks:
      - "odoo"
    volumes:
      - "database:/var/lib/postgresql/data"
    environment:
      - "PGPORT=1002"
      - "POSTGRES_DB=postgres"
      - "PGDATA=/var/lib/postgresql/data"
      - "POSTGRES_USER=Vc617eNaA0v1j6B"
      - "POSTGRES_PASSWORD=RPu4Jito7ZjZWrEnDeB4dS0UxVuEIJhvMGXiXbw0Sr6uTd2Li2h7wE1YI60L6RtrsoY8h2bfjAPZ7z1nkbpeV"
    command: [
    "postgres",
    "-c", "max_connections=512",
    "-c", "shared_buffers=1GB",
    "-c", "effective_cache_size=2GB",
    "-c", "maintenance_work_mem=256MB",
    "-c", "checkpoint_completion_target=0.9",
    "-c", "wal_buffers=16MB",
    "-c", "default_statistics_target=100",
    "-c", "random_page_cost=1.1",
    "-c", "effective_io_concurrency=200",
    "-c", "work_mem=4MB",
    "-c", "huge_pages=off",
    "-c", "min_wal_size=1GB",
    "-c", "max_wal_size=2GB"
    ]

  pgadmin4:
    image: dpage/pgadmin4
    restart: always
    networks:
      - "odoo"
    volumes:
      - "./dev/pgadmin4.json:/pgadmin4/servers.json:ro"
      - "./dev/pgpass:/pgadmin4/pgpass"
      - "./dev/localhost.pem:/certs/server.cert"
      - "./dev/localhost-key.pem:/certs/server.key"
      - "pgadmin:/var/lib/pgadmin"
    environment:
      - "PGADMIN_LISTEN_PORT=1004"
      - "PGADMIN_ENABLE_TLS=true"
      - "PGADMIN_CONFIG_SERVER_MODE=False"
      - "PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False"
      - "PGADMIN_DEFAULT_EMAIL=pg@admin4.com"
      - "PGADMIN_DEFAULT_PASSWORD=admin"
      - "PGPASS_FILE=/pgadmin4/pgpass"

  nginx:
    image: nginx:latest
    restart: always
    depends_on:
      - "odoo"
    networks:
      - "odoo"
    ports:
      - "443:443"
    volumes:
      - "./dev/localhost.conf:/etc/nginx/nginx.conf:ro"
      - "./dev/localhost.pem:/etc/nginx/localhost.pem:ro"
      - "./dev/localhost-key.pem:/etc/nginx/localhost-key.pem:ro"

volumes:
  database:
  filestore:
  pgadmin:

networks:
  odoo:
    driver: bridge